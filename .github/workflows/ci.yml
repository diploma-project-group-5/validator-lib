name: ci

on:
  push:
    branches: [develop, main, "feat/**", "fix/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, resolved 2026-11-08
        with:
          fetch-depth: 0  # gitleaks scans the history
          persist-credentials: false  # no GITHUB_TOKEN in .git/config (it is mounted into gitleaks)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0, resolved 2026-11-14
        with:
          node-version-file: .nvmrc
          cache: npm
      # @lad/contracts is a git dependency pinned to a commit; npm records GitHub as ssh in the
      # lockfile, and the repo is public, so fetch it over https without a key.
      - name: Fetch git dependencies over https
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install (locked)
        run: npm ci
      - name: Lint, typecheck, tests with coverage, build
        run: npm run check
      - name: CLI smoke on the built package
        run: |
          node dist/cli/main.js --version
          echo '{"case_id":"x","input":{}}' | node dist/cli/main.js | grep -q '"INVALID_INPUT"'
      # Services install the library as a git dependency: npm runs `prepare` and packs `files`.
      # npm pack goes through the same steps, so an importable tarball means a working git install.
      - name: Package is importable after install
        run: |
          tarball="$PWD/$(npm pack --silent | tail -n 1)"
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tarball"
          node -e "import('@lad/validator-lib').then((m) => { if (typeof m.validate !== 'function') process.exit(1); console.log('validator', m.VALIDATOR_VERSION); })"
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1
